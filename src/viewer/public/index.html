<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tomotoken 3D Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
      overflow: hidden;
      height: 100vh;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    canvas { display: block; }
    #radar-container {
      position: absolute;
      bottom: 60px;
      left: 16px;
      pointer-events: none;
    }
    #radar-canvas {
      width: 200px;
      height: 200px;
    }
    #bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 8px 20px 12px;
      background: rgba(10, 10, 25, 0.7);
      backdrop-filter: blur(8px);
      pointer-events: none;
    }
    #bottom-bar-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 4px;
    }
    #archetype-label {
      color: #7ecfff;
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    #progress-pct {
      color: rgba(200, 200, 220, 0.7);
      font-size: 11px;
    }
    #exp-bar {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      overflow: hidden;
    }
    #exp-fill {
      height: 100%;
      background: linear-gradient(90deg, #4facfe, #00f2fe);
      border-radius: 3px;
      transition: width 0.5s ease;
    }
    #connection-status {
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 10px;
      color: #666;
    }
    #connection-status.connected { color: #4caf50; }
    #connection-status.disconnected { color: #f44336; }
  </style>
</head>
<body>
  <div id="canvas-container">
    <div id="connection-status" class="disconnected">Disconnected</div>
    <div id="radar-container">
      <canvas id="radar-canvas" width="400" height="400"></canvas>
    </div>
    <div id="bottom-bar">
      <div id="bottom-bar-header">
        <span id="archetype-label">--</span>
        <span id="progress-pct">0%</span>
      </div>
      <div id="exp-bar"><div id="exp-fill" style="width: 0%"></div></div>
    </div>
  </div>

  <!-- Hatch transition overlay -->
  <div id="hatch-flash" style="position:fixed; inset:0; background:white; opacity:0; pointer-events:none; z-index:100;"></div>
  <div id="hatch-loading" style="display:none; position:fixed; inset:0; justify-content:center; align-items:center; z-index:50; pointer-events:none;">
    <div style="text-align:center; color:#fff; font-size:14px;">
      <div style="margin-bottom:8px;">Hatching...</div>
      <div style="width:40px; height:40px; border:3px solid rgba(255,255,255,0.3); border-top:3px solid #fff; border-radius:50%; animation:spin 1s linear infinite; margin:0 auto;"></div>
    </div>
  </div>
  <style>@keyframes spin { to { transform: rotate(360deg); } }</style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
